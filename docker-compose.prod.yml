# Production compose file for the dookblog container on the Compute Engine VM.
#
# WHAT THIS SERVICE IS. The blog has no public homepage of its own. Readers
# reach blog content at dook.bigfat.ai/blog/, which is a route owned by
# DOOKWEBSITE - it renders its own Blade views and fetches the data from this
# app's /api/* endpoints server-side. This container therefore serves two
# audiences, neither of which is a public reader:
#
#   1. dookwebsite, calling /api/all-posts, /api/post_details, /api/blog-search
#      and /api/category/posts server-side.
#   2. editors, using the CMS at / (a login form, not a homepage).
#
# This runs as a SECOND container on the same VM as dookwebsite, which owns
# host ports 80 and 443 and terminates TLS for dook.bigfat.ai.
#
#   dookwebsite  ->  host 80 / 443, public   (TLS terminated in its own nginx)
#   dookblog     ->  port 8001 INSIDE dookwebsite's network namespace,
#                    published nowhere and unreachable from outside the VM
#
# 8001 rather than any free port: that is the port dookwebsite's
# BlogController already expects, and the port the pair use locally.
#
# Publishing nothing is a security property, not an oversight. The CMS login
# form sits at / and is served over plain HTTP; keeping it inside another
# container's namespace means it is reachable only by dookwebsite's own
# server-side calls, never by the internet.
#
# HOW /blog/ IS MADE TO WORK, without changing a line of dookwebsite.
#
# Two separate problems had to be solved, and each has its own mechanism:
#
#   1. Reaching the API. BlogController hardcodes http://127.0.0.1:8001/api/...
#      Inside its own container that loopback address is dookwebsite itself,
#      where nothing listens on 8001 - hence the current
#      {"error":"Failed to fetch blog posts"}. Solved by network_mode below:
#      this container shares dookwebsite's network namespace, so the two sit
#      on one loopback exactly as they do on a developer machine.
#
#   2. Loading the images. ApiBlogController builds absolute image URLs from
#      the address the API was called on, and dookwebsite drops them straight
#      into <img src="...">. Reaching the API over loopback would therefore
#      hand every reader an image URL pointing at their OWN machine. Solved in
#      the Dockerfile's nginx config, which reports the public blog origin for
#      /api/ requests only - that host already serves these same files over
#      HTTPS from this same database.
#
# Neither mechanism is the clean long-term answer. That is to make the base
# URL a config value in both apps rather than a literal in one and a request
# artifact in the other. These two work without touching dookwebsite.
#
# Started by the deploy workflow, not by hand:
#   .github/workflows/deploy.yml
#
# IMAGE is substituted by the workflow to the exact tag it just pushed. Pinning
# a real tag rather than ':latest' is what makes it possible to tell what is
# running and to roll back to what ran before.

services:
  app:
    image: ${IMAGE:-dookblog:prod}

    # Share dookwebsite's network namespace instead of getting one of our own.
    #
    # This is what makes dookwebsite's hardcoded http://127.0.0.1:8001/api/...
    # resolve to this container. Docker's default bridge gives each container
    # its own loopback, so that address would otherwise mean "dookwebsite
    # itself", where nothing listens on 8001 - which is exactly why /blog/
    # returns {"error":"Failed to fetch blog posts"} today. Sharing the
    # namespace reproduces the local setup, where both apps sit on one host's
    # loopback on ports 8000 and 8001.
    #
    # Consequences, all deliberate:
    #   - No `ports:` is possible here; Docker rejects port publishing when a
    #     network namespace is shared. The blog is reachable only from inside
    #     that namespace, which is precisely the access dookwebsite needs and
    #     no more. Editors keep using the existing CMS at
    #     blog.dookinternational.com.
    #   - This container's lifecycle is now coupled to dookwebsite's. When
    #     dookwebsite is redeployed its container is REPLACED, and this one's
    #     namespace disappears with it; Docker then fails to start this
    #     container until the target exists again. `restart: always` below
    #     turns that into self-healing retries rather than an outage needing
    #     hands - but after a dookwebsite deploy, expect this to take a moment
    #     to come back, and redeploy it if it does not.
    #   - The name is dookwebsite's compose-generated container name. If that
    #     project is ever renamed, this line must change with it.
    network_mode: "container:dookwebsite-app-1"

    # Real env vars, never baked into the image. Written by the workflow's
    # "Sync env file" step from the APP_ENV_FILE repository secret.
    env_file:
      - /etc/dookblog/app.env

    volumes:
      # Laravel logs, kept on the host so they survive container replacement.
      - /var/lib/dookblog/storage-logs:/var/www/html/storage/logs

      # Uploaded images. This one is not optional and not cosmetic.
      #
      # PostController and ProfileController write uploads into
      # public_path('images/...') - i.e. INSIDE the container's filesystem.
      # Without this mount every deploy would replace the container and take
      # all uploads since the last build with it, silently, leaving broken
      # images on exactly the newest posts.
      #
      # The mount shadows the ~676 MB of images baked into the image, so the
      # workflow seeds this directory from the image the first time it
      # deploys (see the "Seed uploads directory" step) and leaves it alone
      # afterwards. Must be owned by uid 33 (www-data): php-fpm's master runs
      # as root but its workers do not, and the workers are what write here.
      - /var/lib/dookblog/public-images:/var/www/html/public/images

    healthcheck:
      # Hits the login page, which renders without touching the database, so
      # a dropped VPN tunnel degrades requests instead of restart-looping a
      # container that is otherwise fine.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    restart: always

    logging:
      driver: gcplogs
      options:
        gcp-log-cmd: "true"

    # The VM has 8 GB and dookwebsite's compose already claims up to 6 GB.
    # 1.5 GB here keeps the pair inside the box with a little room for the
    # host, and matches this container's much smaller php-fpm pool
    # (pm.max_children = 5 at 512M each).
    #
    # If both containers are ever under real load at once, lower
    # dookwebsite's limit rather than raising this one - 6 + 1.5 leaves only
    # 0.5 GB for the OS, the VPN tunnel and Docker itself.
    deploy:
      resources:
        limits:
          memory: 1500m
