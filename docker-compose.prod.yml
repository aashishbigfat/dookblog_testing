# Production compose file for the dookblog container on the Compute Engine VM.
#
# WHAT THIS SERVICE IS. The blog has no public homepage of its own. Readers
# reach blog content at dook.bigfat.ai/blog/, which is a route owned by
# DOOKWEBSITE - it renders its own Blade views and fetches the data from this
# app's /api/* endpoints server-side. This container therefore serves two
# audiences, neither of which is a public reader:
#
#   1. dookwebsite, calling /api/all-posts, /api/post_details, /api/blog-search
#      and /api/category/posts server-side.
#   2. editors, using the CMS at / (a login form, not a homepage).
#
# This runs as a SECOND container on the same VM as dookwebsite, which owns
# host ports 80 and 443 and terminates TLS for dook.bigfat.ai. The blog gets
# its own host port instead, mirroring how the two are run locally.
#
#   dookwebsite  ->  host 80 / 443   (TLS terminated in its own nginx)
#   dookblog     ->  host 8001       (plain HTTP, this file)
#
# 8001 rather than any free port: that is the port dookwebsite's
# BlogController already expects, and the port the pair use locally.
#
# NOT YET IN DOOKWEBSITE'S DATA PATH, and this file cannot put it there.
# BlogController hardcodes http://127.0.0.1:8001/api/... - inside its own
# container that loopback address reaches dookwebsite itself, not this
# service. Sharing a network namespace would fix the API call and still leave
# every image broken, because ApiBlogController builds absolute image URLs
# from the address the API was called on:
#
#     $value->image = url('') . '/images/posts/' . $value->image;
#
# so a request arriving at 127.0.0.1:8001 yields image URLs pointing at
# 127.0.0.1:8001 - which the READER'S BROWSER then tries to load, against
# their own machine. dookwebsite passes those URLs through to its views
# unmodified.
#
# Wiring the two together therefore needs a change in dookwebsite (ideally
# making that base URL an env var instead of a literal) plus a publicly
# reachable HTTPS origin for the images. Both are out of scope here.
#
# Traffic to port 8001 is UNENCRYPTED and the CMS login sits at /, so do not
# open this port to the internet without TLS in front of it. Reach it over an
# SSH tunnel instead:
#
#   gcloud compute ssh dookwebsite --zone=asia-south1-a \
#     --project=dook-website-506316 -- -L 8001:localhost:8001
#   then browse http://127.0.0.1:8001/
#
# Started by the deploy workflow, not by hand:
#   .github/workflows/deploy.yml
#
# IMAGE is substituted by the workflow to the exact tag it just pushed. Pinning
# a real tag rather than ':latest' is what makes it possible to tell what is
# running and to roll back to what ran before.

services:
  app:
    image: ${IMAGE:-dookblog:prod}

    ports:
      # Bound to the VM's loopback only, NOT 0.0.0.0. The CMS login is
      # unencrypted, so it must not be published to the internet; the VM's
      # firewall allows only 80/443 inbound anyway, and this makes that
      # explicit rather than incidental. Reach it through the SSH tunnel in
      # the header comment. Change to "8001:80" once TLS fronts it.
      - "127.0.0.1:8001:80"

    # Real env vars, never baked into the image. Written by the workflow's
    # "Sync env file" step from the APP_ENV_FILE repository secret.
    env_file:
      - /etc/dookblog/app.env

    volumes:
      # Laravel logs, kept on the host so they survive container replacement.
      - /var/lib/dookblog/storage-logs:/var/www/html/storage/logs

      # Uploaded images. This one is not optional and not cosmetic.
      #
      # PostController and ProfileController write uploads into
      # public_path('images/...') - i.e. INSIDE the container's filesystem.
      # Without this mount every deploy would replace the container and take
      # all uploads since the last build with it, silently, leaving broken
      # images on exactly the newest posts.
      #
      # The mount shadows the ~676 MB of images baked into the image, so the
      # workflow seeds this directory from the image the first time it
      # deploys (see the "Seed uploads directory" step) and leaves it alone
      # afterwards. Must be owned by uid 33 (www-data): php-fpm's master runs
      # as root but its workers do not, and the workers are what write here.
      - /var/lib/dookblog/public-images:/var/www/html/public/images

    healthcheck:
      # Hits the login page, which renders without touching the database, so
      # a dropped VPN tunnel degrades requests instead of restart-looping a
      # container that is otherwise fine.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    restart: always

    logging:
      driver: gcplogs
      options:
        gcp-log-cmd: "true"

    # The VM has 8 GB and dookwebsite's compose already claims up to 6 GB.
    # 1.5 GB here keeps the pair inside the box with a little room for the
    # host, and matches this container's much smaller php-fpm pool
    # (pm.max_children = 5 at 512M each).
    #
    # If both containers are ever under real load at once, lower
    # dookwebsite's limit rather than raising this one - 6 + 1.5 leaves only
    # 0.5 GB for the OS, the VPN tunnel and Docker itself.
    deploy:
      resources:
        limits:
          memory: 1500m
